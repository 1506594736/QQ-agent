<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SnowLuma</title><link rel="stylesheet" href="../common.css"><link rel="stylesheet" href="style.css"></head><body data-panel="snowluma"><main><header class="head"><div><div class="eyebrow">RUNTIME / CONNECTIVITY</div><h2>SnowLuma</h2><div id="status" class="muted">加载中</div></div><div class="actions"><button id="sl-start">启动 SnowLuma</button><button id="sl-stop" class="danger">停止 SnowLuma</button></div></header><section class="grid"><article class="card"><h3>SnowLuma 日志</h3><pre id="sl-log" class="pre log"></pre><div class="actions"><button id="sl-folder">打开目录</button><button id="sl-webui">打开 WebUI</button></div></article><article class="card"><div class="row"><h3>应用日志</h3><label>日志级别 <select id="log-level"><option>debug</option><option selected>info</option><option>warn</option><option>error</option></select></label></div><pre id="app-log" class="pre log"></pre></article></section></main><script type="module" src="panel.js"></script></body></html>
